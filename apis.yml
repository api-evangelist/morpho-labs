apis:
- name: Morpho API
  description: >-
    Morpho's public GraphQL API providing real-time and historical onchain and
    offchain data across Morpho Blue markets, Morpho Vaults (V1 and V2),
    Midnight fixed-rate markets, user positions, curators, oracles, assets,
    rewards, and transactions. A single GraphQL endpoint with an interactive
    playground; a REST interface is also available for Blue and Midnight data.
    No authentication is required; usage is rate limited to 750 requests/minute
    with a maximum query complexity of 1,000,000. Provided as-is with no SLA.
  humanURL: https://docs.morpho.org/tools/offchain/api/get-started/
