aid: morpho-labs
name: Morpho Labs
description: >-
  Morpho Labs builds Morpho, an open, non-custodial onchain credit network for
  the Ethereum Virtual Machine. The protocol pairs Morpho Blue (a trustless,
  oracle-agnostic, permissionless lending primitive with isolated markets),
  Morpho Vaults (permissionless, curator-managed yield vaults that allocate
  deposits across markets), and Midnight (fixed-rate markets). For developers,
  Morpho publishes a public GraphQL API at api.morpho.org that indexes onchain
  and offchain data for markets, vaults, positions, curators, oracles, assets,
  rewards, and transactions, plus a suite of TypeScript SDKs for building and
  simulating transactions, and detailed documentation at docs.morpho.org.
